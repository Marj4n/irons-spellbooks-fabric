import org.gradle.api.artifacts.transform.*
import org.gradle.api.artifacts.type.ArtifactTypeDefinition
import org.gradle.api.file.FileSystemLocation
import org.gradle.api.provider.Provider
import org.gradle.api.tasks.PathSensitive
import org.gradle.api.tasks.PathSensitivity

plugins {
    id 'fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = mod_version
group = maven_group
base { archivesName = archives_base_name }

loom { accessWidenerPath = file('src/main/resources/irons_spellbooks.accesswidener') }

repositories {
    maven { url = 'https://mvn.devos.one/releases/' }
    maven { url = 'https://mvn.devos.one/snapshots/' }
    maven { url = 'https://api.modrinth.com/maven' }
    maven { url = 'https://raw.githubusercontent.com/Fuzss/modresources/main/maven/' }
    maven { url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/' }
    maven { url = 'https://maven.kosmx.dev/' }
    maven { url = 'https://maven.blamejared.com/' }
}

configurations {
    embeddedFabricApis {
        transitive = false
        attributes.attribute(ArtifactTypeDefinition.ARTIFACT_TYPE_ATTRIBUTE, 'embedded-fabric-apis')
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
    modImplementation 'maven.modrinth:trinkets:AHxQGtuC'
    compileOnly 'org.jetbrains:annotations:24.1.0'
    compileOnly 'com.google.code.findbugs:jsr305:3.0.2'
    modImplementation "fuzs.forgeconfigapiport:forgeconfigapiport-fabric:${forge_config_version}"
    modImplementation 'maven.modrinth:geckolib:AXhbVyuq'
    modImplementation 'maven.modrinth:playeranimator:yDqYTUaf'
    modImplementation 'maven.modrinth:porting_lib:DruV5hjF'
    embeddedFabricApis 'maven.modrinth:porting_lib:DruV5hjF'
    embeddedFabricApis 'maven.modrinth:trinkets:AHxQGtuC'
    compileOnly 'mezz.jei:jei-1.20.1-common-api:15.2.0.22'
    modCompileOnly 'mezz.jei:jei-1.20.1-fabric-api:15.2.0.22'
}

// Resolve embedded original modules lazily, after Loom has configured repositories.
abstract class EmbeddedFabricApiTransform implements TransformAction<TransformParameters.None> {
    @InputArtifact
    @PathSensitive(PathSensitivity.NAME_ONLY)
    abstract Provider<FileSystemLocation> getInputArtifact()

    @Override
    void transform(TransformOutputs outputs) {
        new java.util.zip.ZipFile(inputArtifact.get().asFile).withCloseable { archive ->
            archive.entries().each { entry ->
                if (!entry.directory && entry.name.startsWith('META-INF/jars/') && entry.name.endsWith('.jar')) {
                    def destination = outputs.file(new File(entry.name).name)
                    archive.getInputStream(entry).withCloseable { source ->
                        destination.withOutputStream { target -> source.transferTo(target) }
                    }
                }
            }
        }
    }
}
dependencies {
    registerTransform(EmbeddedFabricApiTransform) {
        from.attribute(ArtifactTypeDefinition.ARTIFACT_TYPE_ATTRIBUTE, 'jar')
        to.attribute(ArtifactTypeDefinition.ARTIFACT_TYPE_ATTRIBUTE, 'embedded-fabric-apis')
    }
    modImplementation files(configurations.embeddedFabricApis)
}

sourceSets.main.resources.srcDir 'src/generated/resources'

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
    exclude 'META-INF/mods.toml', 'META-INF/accesstransformer.cfg'
    exclude '**/*.psd', '**/*.bbmodel'
    exclude 'data/*/forge/biome_modifier/**', 'data/*/neoforge/biome_modifier/**'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}
java { withSourcesJar() }
jar { from('LICENSE.md') { rename { 'LICENSE_UPSTREAM.md' } } }
